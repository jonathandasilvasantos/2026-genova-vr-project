<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Genova VR{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body>
<header><a class="brand" href="/">Genova <span>VR</span></a>
{% if session.user %}<nav><a href="/">Experiences</a><a href="/library">Library</a><a href="/new">+ New</a>
<form method="post" action="/logout"><input type="hidden" name="csrf" value="{{ csrf_token() }}"><button class="btn ghost" style="padding:6px 12px">Sign out</button></form></nav>{% endif %}</header>
<main>{% with msgs = get_flashed_messages() %}{% for m in msgs %}<div class="flash">{{ m }}</div>{% endfor %}{% endwith %}{% block body %}{% endblock %}</main></body></html>
